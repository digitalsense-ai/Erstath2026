<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow 4 - Rolig samtale</title>
<link rel="stylesheet" href="./intake-flow-variants.css">
</head>
<body>
<div class="eh-flow-shell">
<header class="eh-flow-top"><a class="eh-flow-logo" href="./concept-c2a-human-advisor.html"><span>EH</span><b>ErstatningsHjælp</b></a><div class="eh-step-dots"><span class="active"></span><span></span><span></span><span></span></div></header>
<main class="eh-flow-main eh-conversation">
<section class="eh-card eh-conversation-card">
<div class="eh-message assistant"><strong>Hej. Vi starter roligt.</strong><br>Fortæl med dine egne ord, hvad der skete under behandlingen. Det må gerne være kort og ufuldstændigt.</div>
<div class="eh-message user-prompt">Jeg vil gerne finde ud af, om der kan være grundlag for et erstatningskrav.</div>
<div class="eh-conversation-input">
<label style="display:block;font-weight:900;font-size:22px;margin-bottom:12px" for="chat-story">Din første besked</label>
<textarea id="chat-story" class="eh-textarea" placeholder="Fx: Jeg blev udskrevet, men symptomerne fortsatte..."></textarea>
<div class="eh-actions"><span class="eh-safe">🔒 Skriv kun det, du er tryg ved</span><button class="eh-button eh-button-primary">Send og fortsæt</button></div>
</div>
</section>
</main>
</div>
</body>
</html>
