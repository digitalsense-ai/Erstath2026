<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow 2 - Digital modtagelse</title>
<link rel="stylesheet" href="./intake-flow-variants.css">
</head>
<body>
<div class="eh-flow-shell">
<header class="eh-flow-top"><a class="eh-flow-logo" href="./concept-c2a-human-advisor.html"><span>EH</span><b>ErstatningsHjælp</b></a><span class="eh-flow-progress-label">Rolig start · cirka 3-5 minutter</span></header>
<main class="eh-flow-main eh-reception">
<div class="eh-reception-avatar"></div>
<p class="eh-kicker">Digital modtagelse</p>
<h1 class="eh-title">Velkommen. Du behøver ikke forklare det perfekt.</h1>
<p class="eh-reception-note">Skriv bare det vigtigste først. Bagefter hjælper vi dig med ét spørgsmål ad gangen, så vi kan vurdere om sagen bør undersøges nærmere.</p>
<section class="eh-card">
<label style="display:block;font-weight:900;font-size:22px;margin-bottom:12px" for="story">Hvad fik dig til at søge hjælp i dag?</label>
<textarea id="story" class="eh-textarea" placeholder="Fx: Efter min behandling oplevede jeg noget, jeg ikke forstår..."></textarea>
<div class="eh-actions"><span class="eh-safe">🔒 Du kan stoppe når som helst</span><button class="eh-button eh-button-primary">Start første spørgsmål</button></div>
</section>
</main>
</div>
</body>
</html>
