<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow 3 - Wizard</title>
<link rel="stylesheet" href="./intake-flow-variants.css">
</head>
<body>
<div class="eh-flow-shell">
<header class="eh-flow-top"><a class="eh-flow-logo" href="./concept-c2a-human-advisor.html"><span>EH</span><b>ErstatningsHjælp</b></a><span class="eh-flow-progress-label">Trin 1 af 4</span></header>
<main class="eh-flow-main eh-wizard-layout">
<aside class="eh-card eh-wizard-rail">
<p class="eh-kicker">Din vej igennem</p>
<ol>
<li class="active"><span>1</span> Hvad skete der?</li>
<li><span>2</span> Hvornår og hvor?</li>
<li><span>3</span> Hvilke følger?</li>
<li><span>4</span> Næste skridt</li>
</ol>
</aside>
<section class="eh-card eh-wizard-card">
<h1 class="eh-title">Hvad skete der under behandlingen?</h1>
<p class="eh-lead">Fortæl kort om den behandling, undersøgelse, operation eller medicin, du mener kan have ført til en skade eller forværring.</p>
<div style="margin-top:30px"><textarea class="eh-textarea" placeholder="Skriv med dine egne ord. Du behøver ikke kende de juridiske regler."></textarea></div>
<div class="eh-actions"><button class="eh-button eh-button-ghost">Tilbage</button><button class="eh-button eh-button-primary">Næste trin</button></div>
</section>
</main>
</div>
</body>
</html>
