name: Frontend Demo Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "resources/views/frontend-experience/**"
      - "public/frontend-experience/**"
      - "frontend-experience/**"
      - ".github/workflows/pages-frontend-demo.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: frontend-demo-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p _site/frontend-experience
          cp -R public/frontend-experience/* _site/frontend-experience/
          cp resources/views/frontend-experience/intake.blade.php _site/index.html
          sed -i "s|{{ asset('frontend-experience/app.css') }}|./frontend-experience/app.css|g" _site/index.html
          sed -i "s|{{ asset('frontend-experience/fakeConversationData.js') }}|./frontend-experience/fakeConversationData.js|g" _site/index.html
          sed -i "s|{{ asset('frontend-experience/app.js') }}|./frontend-experience/app.js|g" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
